name: Release

# Pushing a tag such as v0.1.0 publishes the macOS app for that version. `tzara setup` downloads
# the app that matches the Tzara version it is running, so the app and the server always agree.
#
#   0. once: app/scripts/create_signing_identity.sh, then save the two GitHub secrets it names
#   1. bump `version` in pyproject.toml
#   2. git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  app:
    name: Build and publish the macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag must match the version in pyproject.toml
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml" >&2
            exit 1
          fi
      - run: make app-test
      - name: Import the signing certificate
        env:
          TZARA_SIGNING_P12: ${{ secrets.TZARA_SIGNING_P12 }}
          TZARA_SIGNING_PASSWORD: ${{ secrets.TZARA_SIGNING_PASSWORD }}
        run: app/scripts/import_signing_identity.sh
      # A release signed ad-hoc would make macOS ask for Input Monitoring again, so refuse it.
      - run: make app-release
        env:
          TZARA_REQUIRE_SIGNING: "1"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/Tzara.app.zip app/build/Tzara.app.zip.sha256 --generate-notes
