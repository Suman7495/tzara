[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tzara"
version = "0.1.0"
description = "Tzara is your personal AI assistant"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Suman Pal" }
]

# Ranges cap the packages whose experimental or pre-1.0 APIs Tzara uses (DeepAgents
# middleware and harness profiles, LangGraph's v3 streaming) at the next minor release.
# requirements.lock pins the exact versions that were tested.
dependencies = [
  "deepagents>=0.6.12,<0.7",
  "fastapi>=0.115,<1",
  "langchain>=1.3.11,<1.4",
  "langchain-core>=1.4.8,<1.5",
  "langchain-ollama>=1.0.1,<1.1",
  "langgraph>=1.2.7,<1.3",
  "ollama>=0.6.1,<0.7",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "rich>=15,<16",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "httpx2>=2,<3",  # Starlette's TestClient prefers it over httpx
  "pylint>=4.1,<5",
  "ruff>=0.17,<0.18",
  "mypy>=2.4,<3",
  "pre-commit>=4,<5",
  "uv>=0.5",
]

[project.scripts]
tzara = "tzara.cli.launcher:Launcher.main"

[tool.setuptools.packages.find]
where = ["src"]

# --- Tests -------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["tzara"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "\\.\\.\\."]

# --- Formatting and linting --------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "C4",       # comprehensions
  "D",        # docstrings
  "RUF",      # ruff-specific
]
ignore = [
  "D203", "D213",  # conflict with D211 / D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pylint.main]
py-version = "3.11"
jobs = 0
fail-under = 10.0

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 6
max-attributes = 10

[tool.pylint."messages control"]
disable = [
  "too-few-public-methods",   # small dataclasses and tools are intentional
  "missing-module-docstring", # enforced by ruff (D100) with a clearer message
  "fixme",
]

# --- Type checking -----------------------------------------------------------

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "tests"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
# LangChain, LangGraph and DeepAgents ship partial or no type information.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tzara.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
