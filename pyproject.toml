[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tzara"
version = "0.1.3"
description = "Tzara is your personal AI assistant"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Suman Pal" }
]

# Ranges cap the packages whose experimental or pre-1.0 APIs Tzara uses (LangChain's agent
# middleware, LangGraph's v3 streaming) at the next minor release.
# requirements.lock pins the exact versions that were tested.
dependencies = [
  "ddgs>=9.16,<10",
  "trafilatura>=2.0,<3",
  "fastapi>=0.115,<1",
  "langchain>=1.3.11,<1.4",
  "langchain-core>=1.4.8,<1.5",
  "langchain-ollama>=1.0.1,<1.1",
  "langgraph>=1.2.7,<1.3",
  "ollama>=0.6.1,<0.7",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "rich>=15,<16",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "httpx2>=2,<3",  # Starlette's TestClient prefers it over httpx
  "ruff>=0.17,<0.18",
  "mypy>=2.4,<3",
  "pre-commit>=4,<5",
  "uv>=0.5",
]

[project.scripts]
tzara = "tzara.cli.launcher:Launcher.main"

[tool.setuptools.packages.find]
where = ["src"]

# --- Tests -------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

# --- Formatting and linting --------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "C4",       # comprehensions
  "D",        # docstrings
  "RUF",      # ruff-specific
]
ignore = [
  "D203", "D213",  # conflict with D211 / D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# --- Type checking -----------------------------------------------------------

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "tests"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
# LangChain and LangGraph ship partial or no type information.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tzara.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
